volumes:
  dbdata:
  appmedia:

services:
  db:
    image: webodm/webodm_db
    container_name: webodm-db
    expose:
      - "5432"
    volumes:
      - dbdata:/var/lib/postgresql/data:Z
    restart: unless-stopped
    oom_score_adj: -100

  broker:
    image: redis:7.0.10
    container_name: webodm-broker
    restart: unless-stopped
    oom_score_adj: -500

  webapp:
    image: webodm/webodm_webapp
    container_name: webodm-webapp
    entrypoint: /bin/bash -c "service cron start && chmod +x /webodm/*.sh && /bin/bash -c \"/webodm/wait-for-postgres.sh db /webodm/wait-for-it.sh -t 0 broker:6379 -- /webodm/start.sh\""
    volumes:
      - appmedia:/webodm/app/media:z
    ports:
      - "${WO_PORT:-8000}:8000/tcp"
      - "${WO_PORT:-8000}:8000/udp"
    depends_on:
      - db
      - broker
      - worker
    environment:
      - WO_PORT=${WO_PORT:-8000}
      - WO_HOST=${WO_HOST:-localhost}
      - WO_DEBUG=NO
      - WO_BROKER=redis://broker
      - WO_SECRET_KEY=${WO_SECRET_KEY}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-1}
    restart: unless-stopped
    oom_score_adj: 0

  worker:
    image: webodm/webodm_webapp
    container_name: webodm-worker
    entrypoint: /bin/bash -c "/webodm/wait-for-postgres.sh db /webodm/wait-for-it.sh -t 0 broker:6379 -- /webodm/wait-for-it.sh -t 0 webapp:8000 -- /webodm/worker.sh start"
    volumes:
      - appmedia:/webodm/app/media:z
    depends_on:
      - db
      - broker
    environment:
      - WO_BROKER=redis://broker
      - WO_DEBUG=NO
      - WO_SECRET_KEY=${WO_SECRET_KEY}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-1}
    restart: unless-stopped
    oom_score_adj: 250

  clusterodm:
    image: opendronemap/clusterodm
    container_name: clusterodm
    # --public-address é necessário para o recurso de "split" funcionar:
    # é o endereço que o ClusterODM informa para os workers remotos "telefonarem
    # de volta" durante uma tarefa dividida (split-merge) entre várias máquinas.
    # O webapp (WebODM) continua falando com "clusterodm:3000" direto pela rede
    # interna do Docker - isso aqui é só para as máquinas workers conseguirem
    # alcançar o ClusterODM pela rede local.
    command: ["--public-address", "http://${HUB_IP}:${CLUSTERODM_PORT:-3001}"]
    ports:
      # Porta pública do ClusterODM (não usamos a 3000 direto, de propósito,
      # pra evitar conflito com outros programas/containers comuns que já
      # costumam usar a porta 3000 nesta máquina).
      - "${CLUSTERODM_PORT:-3001}:3000"
      - "8080:8080"   # porta de administração (linha de comando / telnet)
      - "10000:10000" # painel de administração via navegador
    restart: unless-stopped

  # NodeODM local: faz esta própria máquina (o "hub") também processar imagens,
  # além de distribuir tarefas para as máquinas "worker" da rede.
  nodeodm-local:
    image: opendronemap/nodeodm
    container_name: nodeodm-local
    restart: unless-stopped
